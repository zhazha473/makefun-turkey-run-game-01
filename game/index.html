<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GOBBLE RUN — Escape the Thanksgiving Table</title>
  <meta name="description" content="GOBBLE RUN: a turkey escapes becoming Thanksgiving dinner. Run the farmyard, slip through the barn, outrun the kitchen oven — 3 stages, 6 hazards, 9 hiding spots, 72 corn.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <header class="masthead">
      <h1>GOBBLE RUN</h1>
      <p>Escape the Thanksgiving Table — 3 stages · 6 hazards · 9 hiding spots · 72 corn</p>
    </header>
    <canvas id="game" width="1280" height="720" aria-label="Gobble Run game canvas"></canvas>
    <footer class="controls">
      <span><b>Space / ↑ / click</b> jump</span>
      <span><b>↓ / S</b> hide in the hay</span>
      <span><b>Shift</b> sprint</span>
      <span><b>P</b> pause</span>
      <span><b>M</b> mute</span>
      <span><b>R</b> restart</span>
    </footer>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
